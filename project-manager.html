<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企画管理パネル | Stage Link</title>
<!-- Supabase SDK の読み込み -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --wine: #7c2946; --wine-deep: #4a1428; --gold: #b8863f; --bg: #f3ecdf; --card-bg: #fffcf5; --line: #e0d3bd; --ink: #1f1a16; }
  body { font-family: sans-serif; background-color: var(--bg); color: var(--ink); margin: 0; padding: 40px 20px; }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 24px; color: var(--wine-deep); border-bottom: 3px solid var(--gold); padding-bottom: 10px; }
  .card-item { background: var(--card-bg); border: 1px solid var(--line); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
  .btn-delete { background: #c0392b; color: #fff; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .form-group { display: flex; flex-direction: column; }
  .form-group.full { grid-column: span 2; }
  .checkbox-group { flex-direction: row; align-items: center; gap: 8px; margin-top: 10px; }
  label { font-size: 12px; font-weight: bold; margin-bottom: 4px; }
  input, textarea, select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
  .actions { display: flex; gap: 12px; margin-top: 30px; position: sticky; bottom: 20px; background: rgba(243, 236, 223, 0.9); padding: 15px; border-radius: 8px; }
  .btn-add { background: #27ae60; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; flex: 1; font-weight: bold; }
  .btn-save { background: var(--wine-deep); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; flex: 2; font-weight: bold; }
</style>
</head>
<body>

<div class="wrap">
  <h1>Stage Link 企画管理（Supabase連携版）</h1>
  <div id="projectList">データ読み込み中...</div>

  <div class="actions">
    <button type="button" class="btn-add" id="btnAdd">＋ 新しい企画を追加</button>
    <button type="button" class="btn-save" id="btnSave">🚀 データベースに即時反映</button>
  </div>
</div>

<script>
  // ★ご自身の Supabase 情報を設定してください★
  const SUPABASE_URL = 'https://YOUR-PROJECT-ID.supabase.co';
  const SUPABASE_KEY = 'YOUR-ANON-KEY';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let projectsData = [];

  // 初回データ取得
  async function loadData() {
    const { data, error } = await db.from('projects').select('*').order('sort_order', { ascending: true });
    if (error) {
      alert('データ取得エラー: ' + error.message);
      return;
    }
    projectsData = data || [];
    renderList();
  }

  function renderList() {
    const listEl = document.getElementById('projectList');
    listEl.innerHTML = '';

    projectsData.forEach((item, index) => {
      const card = document.createElement('div');
      card.className = 'card-item';
      card.innerHTML = `
        <div class="card-header">
          <strong>企画 #${String(index + 1).padStart(2, '0')}</strong>
          <button class="btn-delete" onclick="removeProject(${index})">削除</button>
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label>タイトル</label>
            <input type="text" value="${escapeHtml(item.title || '')}" oninput="updateData(${index}, 'title', this.value)">
          </div>
          <div class="form-group">
            <label>サブタイトル</label>
            <input type="text" value="${escapeHtml(item.subtitle || '')}" oninput="updateData(${index}, 'subtitle', this.value)">
          </div>
          <div class="form-group full">
            <label>説明文</label>
            <textarea rows="2" oninput="updateData(${index}, 'desc', this.value)">${escapeHtml(item.desc || '')}</textarea>
          </div>
          <div class="form-group">
            <label>タグ（カンマ区切り）</label>
            <input type="text" value="${escapeHtml((item.tags || []).join(', '))}" onchange="updateTags(${index}, this.value)">
          </div>
          <div class="form-group">
            <label>リンクURL</label>
            <input type="text" value="${escapeHtml(item.link || '#')}" oninput="updateData(${index}, 'link', this.value)">
            <div class="form-group checkbox-group">
              <input type="checkbox" id="tb_${index}" ${item.target_blank ? 'checked' : ''} onchange="updateData(${index}, 'target_blank', this.checked)">
              <label for="tb_${index}">新しいタブで開く</label>
            </div>
          </div>
          <div class="form-group">
            <label>表示タイプ</label>
            <select onchange="updateData(${index}, 'media_type', this.value); renderList();">
              <option value="icon" ${item.media_type === 'icon' ? 'selected' : ''}>アイコン</option>
              <option value="image" ${item.media_type === 'image' ? 'selected' : ''}>背景画像</option>
              <option value="layered" ${item.media_type === 'layered' ? 'selected' : ''}>レイヤー</option>
            </select>
          </div>
          ${renderMediaFields(item, index)}
        </div>
      `;
      listEl.appendChild(card);
    });
  }

  function renderMediaFields(item, index) {
    if (item.media_type === 'icon') {
      return `<div class="form-group"><label>アイコン/絵文字</label><input type="text" value="${escapeHtml(item.icon || '✨')}" oninput="updateData(${index}, 'icon', this.value)"></div>`;
    } else if (item.media_type === 'layered') {
      return `
        <div class="form-group"><label>背景画像URL</label><input type="text" value="${escapeHtml(item.bg_image || '')}" oninput="updateData(${index}, 'bg_image', this.value)"></div>
        <div class="form-group"><label>前面ポスターURL</label><input type="text" value="${escapeHtml(item.poster_image || '')}" oninput="updateData(${index}, 'poster_image', this.value)"></div>
        <div class="form-group"><label>ポスタータグ</label><input type="text" value="${escapeHtml(item.poster_tag || '')}" oninput="updateData(${index}, 'poster_tag', this.value)"></div>
      `;
    } else {
      return `<div class="form-group"><label>背景画像URL</label><input type="text" value="${escapeHtml(item.bg_image || '')}" oninput="updateData(${index}, 'bg_image', this.value)"></div>`;
    }
  }

  function updateData(index, key, value) { projectsData[index][key] = value; }
  function updateTags(index, value) { projectsData[index].tags = value.split(',').map(s => s.trim()).filter(Boolean); }

  async function removeProject(index) {
    const item = projectsData[index];
    if (confirm('削除しますか？')) {
      if (item.id) {
        await db.from('projects').delete().eq('id', item.id);
      }
      projectsData.splice(index, 1);
      renderList();
    }
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  document.getElementById('btnAdd').addEventListener('click', () => {
    projectsData.push({
      title: "新規企画",
      subtitle: "",
      desc: "",
      tags: ["NEW"],
      link: "#",
      target_blank: false,
      media_type: "icon",
      icon: "🎉",
      sort_order: projectsData.length + 1
    });
    renderList();
  });

  // データベースへの即時保存処理
  document.getElementById('btnSave').addEventListener('click', async () => {
    const btn = document.getElementById('btnSave');
    btn.textContent = '保存中...';
    btn.disabled = true;

    // 一括アップサート（更新 & 新規保存）
    const payload = projectsData.map((item, idx) => ({ ...item, sort_order: idx + 1 }));
    const { error } = await db.from('projects').upsert(payload);

    btn.disabled = false;
    btn.textContent = '🚀 データベースに即時反映';

    if (error) {
      alert('保存失敗: ' + error.message);
    } else {
      alert('what.html へ即時反映されました！');
      loadData();
    }
  });

  loadData();
</script>
</body>
</html>
