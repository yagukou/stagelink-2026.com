<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule｜Stage Link</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --bg: #121013;
      --card-bg: #1e1a1f;
      --card-hover: #262128;
      --text: #f3f0f4;
      --text-sub: #a095a3;
      --wine: #a9325c;
      --wine-light: rgba(169, 50, 92, 0.15);
      --wine-glow: rgba(169, 50, 92, 0.4);
      --border: #312833;
      --radius: 16px;
      --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 60px 20px;
      line-height: 1.7;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(169, 50, 92, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(74, 20, 40, 0.15) 0%, transparent 40%);
      background-attachment: fixed;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* ヘッダー */
    .page-header {
      margin-bottom: 32px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .page-subtitle {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--wine);
      font-weight: 700;
    }
    h1 {
      font-size: 32px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 14px;
    }
    h1::before {
      content: '';
      width: 10px;
      height: 32px;
      background: var(--wine);
      border-radius: 6px;
      box-shadow: 0 0 15px var(--wine);
    }

    /* タブ切り替えボタン（ピル型ネオン風） */
    .tab-container {
      display: flex;
      gap: 12px;
      margin-bottom: 40px;
      overflow-x: auto;
      padding-bottom: 6px;
    }
    .tab-btn {
      background: var(--card-bg);
      color: var(--text-sub);
      border: 1px solid var(--border);
      padding: 12px 24px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
      font-family: 'Noto Sans JP', sans-serif;
    }
    .tab-btn:hover {
      border-color: var(--wine);
      color: var(--text);
      background: var(--card-hover);
    }
    .tab-btn.active {
      background: var(--wine);
      color: #ffffff;
      border-color: var(--wine);
      box-shadow: 0 4px 20px var(--wine-glow);
    }

    /* セクションヘッダー＆コントロール */
    .section-header-area {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 40px 0 20px 0;
      flex-wrap: wrap;
      gap: 16px;
    }
    h2 {
      font-size: 20px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
    }
    .count-badge {
      font-size: 12px;
      background: var(--wine-light);
      color: var(--wine);
      border: 1px solid rgba(169, 50, 92, 0.3);
      padding: 3px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .filter-controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .search-input, .filter-select {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      outline: none;
      transition: var(--transition);
      font-family: 'Noto Sans JP', sans-serif;
    }
    .search-input { width: 240px; }
    .search-input:focus, .filter-select:focus {
      border-color: var(--wine);
      box-shadow: 0 0 0 3px var(--wine-light);
    }
    .filter-select { cursor: pointer; }

    /* リスト＆カードデザイン（チケット風シアターレイアウト） */
    .schedule-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .schedule-section {
      display: block;
    }
    .schedule-section.hidden {
      display: none !important;
    }

    .schedule-item {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      display: flex;
      align-items: center;
      gap: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
      transition: var(--transition);
    }
    .schedule-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 4px;
      background: var(--wine);
      opacity: 0.6;
      transition: var(--transition);
    }
    .schedule-item:hover {
      transform: translateY(-3px);
      border-color: rgba(169, 50, 92, 0.4);
      background: var(--card-hover);
      box-shadow: 0 15px 35px rgba(0,0,0,0.3), 0 0 15px var(--wine-light);
    }
    .schedule-item:hover::before {
      opacity: 1;
      box-shadow: 0 0 10px var(--wine);
    }
    
    /* チケット風日付バッジ */
    .date-badge {
      background: var(--wine-light);
      color: var(--text);
      border: 1px dashed rgba(169, 50, 92, 0.4);
      padding: 12px 16px;
      border-radius: 12px;
      text-align: center;
      min-width: 115px;
      flex-shrink: 0;
    }
    .date-badge .label { 
      font-size: 10px; 
      font-weight: 700; 
      text-transform: uppercase; 
      letter-spacing: 0.1em; 
      color: var(--wine); 
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .date-badge .date { 
      font-size: 15px; 
      font-weight: 700; 
      margin-top: 4px; 
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* メインコンテンツ */
    .schedule-content {
      flex-grow: 1;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .schedule-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
      letter-spacing: 0.02em;
    }
    .schedule-subtitle {
      font-size: 13px;
      color: var(--wine);
      font-weight: 500;
      margin-bottom: 8px;
    }
    .schedule-desc {
      font-size: 13px;
      color: var(--text-sub);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.6;
    }

    /* メタ情報（部数やステータス） */
    .schedule-meta {
      text-align: right;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }
    .schedule-copies {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }
    .status-accepted { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
    .status-pending { background: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3); }
    .status-default { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.3); }

    /* ローディング・空の状態 */
    .loading, .empty {
      text-align: center;
      padding: 50px;
      color: var(--text-sub);
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px dashed var(--border);
      font-size: 14px;
    }

    /* レスポンシブ対応 */
    @media (max-width: 680px) {
      body { padding: 30px 12px; }
      .section-header-area { flex-direction: column; align-items: flex-start; }
      .filter-controls { width: 100%; }
      .search-input { flex: 1; width: auto; }
      .schedule-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }
      .date-badge, .schedule-meta {
        width: 100%;
        text-align: left;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
      .schedule-meta {
        align-items: center;
        border-top: 1px solid var(--border);
        padding-top: 12px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="page-header">
    <span class="page-subtitle">StageLink Management</span>
    <h1>スケジュール一覧</h1>
  </div>

  <!-- ピル型切り替えタブ -->
  <div class="tab-container">
    <button class="tab-btn active" onclick="switchTab('all', this)">すべて表示</button>
    <button class="tab-btn" onclick="switchTab('events', this)">公演・企画スケジュール</button>
    <button class="tab-btn" onclick="switchTab('requests', this)">ビラ折込スケジュール</button>
  </div>

  <!-- 1. 公演・企画スケジュールセクション -->
  <div id="events-wrapper" class="schedule-section">
    <div class="section-header-area">
      <h2>
        <span>公演・企画スケジュール</span>
        <span id="events-count" class="count-badge">0件</span>
      </h2>
      <div class="filter-controls">
        <input type="text" id="events-search" class="search-input" placeholder="企画をキーワード検索..." oninput="filterEvents()">
      </div>
    </div>
    <div id="events-container" class="schedule-list">
      <div class="loading">企画スケジュール情報を読み込んでいます...</div>
    </div>
  </div>

  <!-- 2. ビラ折込スケジュールセクション -->
  <div id="requests-wrapper" class="schedule-section">
    <div class="section-header-area">
      <h2>
        <span>ビラ折込スケジュール</span>
        <span id="requests-count" class="count-badge">0件</span>
      </h2>
      <div class="filter-controls">
        <input type="text" id="requests-search" class="search-input" placeholder="劇団名などを検索..." oninput="filterRequests()">
        <select id="status-filter" class="filter-select" onchange="filterRequests()">
          <option value="">すべてのステータス</option>
          <option value="accepted">承認済み</option>
          <option value="pending">申請中</option>
        </select>
      </div>
    </div>
    <div id="requests-container" class="schedule-list">
      <div class="loading">折込スケジュール情報を読み込んでいます...</div>
    </div>
  </div>
</div>

<script>
  let allEvents = [];
  let allRequests = [];

  // ① ビラネ用 Supabase 設定
  const SUPABASE_URL = "https://azdvqobryrpxriftaale.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF6ZHZxb2JyeXJweHJpZnRhYWxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzMzIzNjYsImV4cCI6MjA5NjkwODM2Nn0.tLopMSF670ok2jXHq6_G-MYtIajdCrxmsQ4TDIv5u_A";
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
  });

  // ② 企画用 Supabase 設定
  const EVENTS_URL = "https://blviywoprvcatwwrrysi.supabase.co";
  const EVENTS_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJsdml5d29wcnZjYXR3d3JyeXNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MzM2MDUsImV4cCI6MjA5ODAwOTYwNX0.SAp7KNf21RKE5SStRlazyX5zKe-LVVCcEHz_fBV6UP8";
  const dbEvents = supabase.createClient(EVENTS_URL, EVENTS_KEY, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
  });

  document.addEventListener('DOMContentLoaded', () => {
    fetchAllData();
  });

  // タブ切り替え機能
  function switchTab(type, btnElement) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    btnElement.classList.add('active');

    const eventsWrapper = document.getElementById('events-wrapper');
    const requestsWrapper = document.getElementById('requests-wrapper');

    if (type === 'all') {
      eventsWrapper.classList.remove('hidden');
      requestsWrapper.classList.remove('hidden');
    } else if (type === 'events') {
      eventsWrapper.classList.remove('hidden');
      requestsWrapper.classList.add('hidden');
    } else if (type === 'requests') {
      eventsWrapper.classList.add('hidden');
      requestsWrapper.classList.remove('hidden');
    }
  }

  // データの一括取得
  async function fetchAllData() {
    const { data: eventsData, error: eventsError } = await dbEvents.from('events').select('*');
    if (eventsError) {
      console.error('Events取得エラー:', eventsError);
      document.getElementById('events-container').innerHTML = `<div class="empty" style="color:#f87171;">取得エラー: ${escapeHtml(eventsError.message)}</div>`;
    } else {
      allEvents = eventsData || [];
    }

    const { data: requestsData, error: requestsError } = await db.from('requests').select('*');
    if (requestsError) {
      console.error('Requests取得エラー:', requestsError);
      document.getElementById('requests-container').innerHTML = `<div class="empty" style="color:#f87171;">折込データの取得に失敗しました: ${escapeHtml(requestsError.message)}</div>`;
    } else {
      allRequests = requestsData || [];
      allRequests.sort((a, b) => {
        const dateA = a.foldingDate || a.folding_date || '';
        const dateB = b.foldingDate || b.folding_date || '';
        return dateB.localeCompare(dateA);
      });
    }

    renderEvents(allEvents);
    renderRequests(allRequests);
  }

  // 1. 企画スケジュールの個別絞り込み
  function filterEvents() {
    const keyword = document.getElementById('events-search').value.toLowerCase();
    const filtered = allEvents.filter(item => {
      const title = (item.title || '').toLowerCase();
      const subtitle = (item.subtitle || '').toLowerCase();
      const desc = (item.description || '').toLowerCase();
      return title.includes(keyword) || subtitle.includes(keyword) || desc.includes(keyword);
    });
    renderEvents(filtered);
  }

  // 2. ビラ折込スケジュールの個別絞り込み
  function filterRequests() {
    const keyword = document.getElementById('requests-search').value.toLowerCase();
    const statusFilter = document.getElementById('status-filter').value;

    const filtered = allRequests.filter(item => {
      const troupeName = (item.fromName || item.troupe_name || item.from_name || '').toLowerCase();
      const delivery = (item.deliveryMethod || item.delivery_method || '').toLowerCase();
      const status = item.status || '';
      
      const matchKeyword = troupeName.includes(keyword) || delivery.includes(keyword);
      const matchStatus = statusFilter === "" || status === statusFilter;

      return matchKeyword && matchStatus;
    });
    renderRequests(filtered);
  }

  // 企画リスト描画
  function renderEvents(events) {
    const container = document.getElementById('events-container');
    document.getElementById('events-count').textContent = `${events.length}件`;

    if (events.length === 0) {
      container.innerHTML = '<div class="empty">該当する企画スケジュールはありません。</div>';
      return;
    }

    container.innerHTML = '';
    events.forEach(item => {
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = item.description || '';
      const plainText = tempDiv.textContent || tempDiv.innerText || '';
      const subtitleHtml = item.subtitle ? `<div class="schedule-subtitle">${escapeHtml(item.subtitle)}</div>` : '';

      const itemHtml = `
        <div class="schedule-item">
          <div class="date-badge">
            <div class="label">ID</div>
            <div class="date">#${item.id}</div>
          </div>
          <div class="schedule-content">
            <div class="schedule-title">${escapeHtml(item.title || 'タイトルなし')}</div>
            ${subtitleHtml}
            <div class="schedule-desc">${escapeHtml(plainText)}</div>
          </div>
        </div>
      `;
      container.insertAdjacentHTML('beforeend', itemHtml);
    });
  }

  // ビラ折込リスト描画
  function renderRequests(requests) {
    const container = document.getElementById('requests-container');
    document.getElementById('requests-count').textContent = `${requests.length}件`;

    if (requests.length === 0) {
      container.innerHTML = '<div class="empty">該当する折込予定はありません。</div>';
      return;
    }

    container.innerHTML = '';
    requests.forEach(item => {
      const foldingDate = item.foldingDate || item.folding_date || '日付未定';
      const troupeName = item.fromName || item.troupe_name || item.from_name || '名称未設定';
      const copies = item.copies ? `${item.copies}部` : '部数未設定';
      const size = item.size ? `(${item.size})` : '';
      const statusCode = item.status || '';
      const statusText = statusCode === 'accepted' ? '承認済み' : (statusCode === 'pending' ? '申請中' : statusCode || '受付中');
      const statusClass = statusCode === 'accepted' ? 'status-accepted' : (statusCode === 'pending' ? 'status-pending' : 'status-default');
      const delivery = item.deliveryMethod || item.delivery_method || '未定';

      const itemHtml = `
        <div class="schedule-item">
          <div class="date-badge">
            <div class="label">折込予定日</div>
            <div class="date">${escapeHtml(foldingDate)}</div>
          </div>
          <div class="schedule-content">
            <div class="schedule-title">折り込み：${escapeHtml(troupeName)}</div>
            <div class="schedule-desc">受け渡し方法: ${escapeHtml(delivery)}</div>
          </div>
          <div class="schedule-meta">
            <div class="schedule-copies">${escapeHtml(copies)} ${escapeHtml(size)}</div>
            <div><span class="status-badge ${statusClass}">${escapeHtml(statusText)}</span></div>
          </div>
        </div>
      `;
      container.insertAdjacentHTML('beforeend', itemHtml);
    });
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>

</body>
</html>
