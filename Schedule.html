<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公演一覧｜Stage Link</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --bg: #e6e6e6;             /* 劇団四季風のグレー背景 */
      --card-outer: #e0e0e0;     /* カード外枠・ヘッダー背景 */
      --card-bg: #ffffff;
      --text: #000000;
      --text-sub: #555555;
      --pink-bg: #fde8ed;        /* 上演中！等のピンク背景 */
      --red-text: #cc0000;       /* 上演中！の赤文字 */
      --btn-gray: #dcdcdc;       /* 右側ボタンのグレー */
      --border: #cccccc;
      --tab-active-bg: #ffffff;
      --wine: #7c2946;           /* StageLinkのブランドカラー */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 60px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* 上部ナビゲーションタブ（四季風） */
    .top-tabs {
      display: flex;
      background: #f0f0f0;
      border-bottom: 2px solid var(--border);
      margin-bottom: 20px;
    }
    .top-tab {
      flex: 1;
      padding: 16px 10px;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      background: #e8e8e8;
      border: none;
      border-right: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .top-tab:last-child { border-right: none; }
    .top-tab.active {
      background: var(--tab-active-bg);
      border-top: 3px solid var(--wine);
    }

    /* フィルター・カテゴリリンク風（地域ナビ） */
    .sub-nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 15px 0;
      font-size: 14px;
      color: #0056b3;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .sub-nav a {
      color: #0056b3;
      text-decoration: none;
      cursor: pointer;
    }
    .sub-nav a:hover { text-decoration: underline; }

    /* メインコンテンツエリア（白い枠線付き背景） */
    .content-box {
      background: #ffffff;
      padding: 30px;
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    .section-header {
      margin-bottom: 24px;
    }
    .section-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .count-badge {
      font-size: 14px;
      font-weight: normal;
      color: var(--text-sub);
    }

    /* 検索バー（実用性追加） */
    .filter-bar {
      margin-top: 12px;
      display: flex;
      gap: 10px;
    }
    .search-input {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
      width: 100%;
      max-width: 300px;
    }

    /* 四季風 グリッドレイアウト（2列） */
    .shiki-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    /* 四季風 1カードデザイン */
    .shiki-card {
      background: #ececec;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #d4d4d4;
      display: flex;
      flex-direction: column;
    }

    /* カード上部（タイトル＆アイコン/サムネイル） */
    .card-top {
      padding: 16px;
      display: flex;
      gap: 14px;
      background: #ececec;
      min-height: 100px;
    }
    .card-thumb {
      width: 70px;
      height: 70px;
      background: var(--wine);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      border-radius: 4px;
      flex-shrink: 0;
      text-align: center;
      padding: 4px;
    }
    .card-info {
      flex-grow: 1;
    }
    .card-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
      line-height: 1.3;
    }
    .card-subtitle {
      font-size: 12px;
      color: #0056b3;
      margin-bottom: 4px;
      display: inline-block;
    }
    .card-desc {
      font-size: 12px;
      color: var(--text-sub);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
    }

    /* カード下部（ピンク/グレーのアクションエリア） */
    .card-bottom {
      background: #ffffff;
      padding: 12px;
      display: flex;
      gap: 10px;
      align-items: center;
      margin: 0 12px 12px 12px;
      border-radius: 4px;
    }

    /* 左側：状態表示エリア（上演中風ピンク背景） */
    .status-box {
      flex: 1;
      background: var(--pink-bg);
      padding: 10px;
      text-align: center;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 64px;
    }
    .status-main {
      font-size: 15px;
      font-weight: 700;
      color: var(--red-text);
      margin-bottom: 2px;
    }
    .status-sub {
      font-size: 11px;
      color: var(--text-sub);
    }

    /* 右側：ボタンエリア */
    .action-btns {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 140px;
      flex-shrink: 0;
    }
    .btn-shiki {
      background: var(--btn-gray);
      color: var(--text);
      text-decoration: none;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      border: 1px solid #c8c8c8;
      cursor: pointer;
    }
    .btn-shiki:hover {
      background: #d0d0d0;
    }
    .btn-shiki::before {
      content: '›';
      font-size: 16px;
      font-weight: bold;
      color: #333;
    }

    /* ローディング・空の状態 */
    .loading, .empty {
      grid-column: span 2;
      text-align: center;
      padding: 40px;
      color: var(--text-sub);
      background: #f9f9f9;
      border-radius: 4px;
      border: 1px dashed #ccc;
    }

    .hidden { display: none !important; }

    /* レスポンシブ対応（スマホで1列） */
    @media (max-width: 768px) {
      body { padding: 10px; }
      .content-box { padding: 16px; }
      .shiki-grid { grid-template-columns: 1fr; }
      .card-bottom { flex-direction: column; }
      .action-btns { width: 100%; }
      .loading, .empty { grid-column: span 1; }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- 四季風 トップタブ -->
  <div class="top-tabs">
    <button class="top-tab active" onclick="switchTab('all', this)">
      <span>📋</span> スケジュール一覧
    </button>
    <button class="top-tab" onclick="switchTab('events', this)">
      <span>🎭</span> 公演・企画
    </button>
    <button class="top-tab" onclick="switchTab('requests', this)">
      <span>📩</span> ビラ折込
    </button>
  </div>

  <!-- メインコンテンツボックス -->
  <div class="content-box">
    
    <!-- 1. 公演・企画スケジュールエリア -->
    <div id="events-section">
      <div class="section-header">
        <div class="section-title">
          <span>公演・企画スケジュール</span>
          <span id="events-count" class="count-badge">0件</span>
        </div>
        <div class="filter-bar">
          <input type="text" id="events-search" class="search-input" placeholder="企画名やキーワードで検索..." oninput="filterEvents()">
        </div>
      </div>

      <div id="events-container" class="shiki-grid">
        <div class="loading">公演・企画情報を読み込んでいます...</div>
      </div>
    </div>

    <!-- 2. ビラ折込スケジュールエリア -->
    <div id="requests-section" style="margin-top: 40px;">
      <div class="section-header">
        <div class="section-title">
          <span>ビラ折込スケジュール</span>
          <span id="requests-count" class="count-badge">0件</span>
        </div>
        <div class="filter-bar">
          <input type="text" id="requests-search" class="search-input" placeholder="劇団名や受渡方法で検索..." oninput="filterRequests()">
        </div>
      </div>

      <div id="requests-container" class="shiki-grid">
        <div class="loading">折込スケジュール情報を読み込んでいます...</div>
      </div>
    </div>

  </div>
</div>

<script>
  let allEvents = [];
  let allRequests = [];

  // ① ビラネ用 Supabase 設定
  const SUPABASE_URL = "https://azdvqobryrpxriftaale.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF6ZHZxb2JyeXJweHJpZnRhYWxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzMzIzNjYsImV4cCI6MjA5NjkwODM2Nn0.tLopMSF670ok2jXHq6_G-MYtIajdCrxmsQ4TDIv5u_A";
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
  });

  // ② 企画用 Supabase 設定
  const EVENTS_URL = "https://blviywoprvcatwwrrysi.supabase.co";
  const EVENTS_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJsdml5d29wcnZjYXR3d3JyeXNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MzM2MDUsImV4cCI6MjA5ODAwOTYwNX0.SAp7KNf21RKE5SStRlazyX5zKe-LVVCcEHz_fBV6UP8";
  const dbEvents = supabase.createClient(EVENTS_URL, EVENTS_KEY, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
  });

  document.addEventListener('DOMContentLoaded', () => {
    fetchAllData();
  });

  // タブ切り替え
  function switchTab(type, btnElement) {
    document.querySelectorAll('.top-tab').forEach(btn => btn.classList.remove('active'));
    btnElement.classList.add('active');

    const eventsSec = document.getElementById('events-section');
    const requestsSec = document.getElementById('requests-section');

    if (type === 'all') {
      eventsSec.classList.remove('hidden');
      requestsSec.classList.remove('hidden');
    } else if (type === 'events') {
      eventsSec.classList.remove('hidden');
      requestsSec.classList.add('hidden');
    } else if (type === 'requests') {
      eventsSec.classList.add('hidden');
      requestsSec.classList.remove('hidden');
    }
  }

  // データ取得
  async function fetchAllData() {
    const { data: eventsData, error: eventsError } = await dbEvents.from('events').select('*');
    if (eventsError) {
      console.error('Events取得エラー:', eventsError);
      document.getElementById('events-container').innerHTML = `<div class="empty" style="color:red;">取得エラー: ${escapeHtml(eventsError.message)}</div>`;
    } else {
      allEvents = eventsData || [];
    }

    const { data: requestsData, error: requestsError } = await db.from('requests').select('*');
    if (requestsError) {
      console.error('Requests取得エラー:', requestsError);
      document.getElementById('requests-container').innerHTML = `<div class="empty" style="color:red;">折込データの取得に失敗しました: ${escapeHtml(requestsError.message)}</div>`;
    } else {
      allRequests = requestsData || [];
      allRequests.sort((a, b) => {
        const dateA = a.foldingDate || a.folding_date || '';
        const dateB = b.foldingDate || b.folding_date || '';
        return dateB.localeCompare(dateA);
      });
    }

    renderEvents(allEvents);
    renderRequests(allRequests);
  }

  // 企画絞り込み
  function filterEvents() {
    const keyword = document.getElementById('events-search').value.toLowerCase();
    const filtered = allEvents.filter(item => {
      const title = (item.title || '').toLowerCase();
      const subtitle = (item.subtitle || '').toLowerCase();
      const desc = (item.description || '').toLowerCase();
      return title.includes(keyword) || subtitle.includes(keyword) || desc.includes(keyword);
    });
    renderEvents(filtered);
  }

  // 折込絞り込み
  function filterRequests() {
    const keyword = document.getElementById('requests-search').value.toLowerCase();
    const filtered = allRequests.filter(item => {
      const troupeName = (item.fromName || item.troupe_name || item.from_name || '').toLowerCase();
      const delivery = (item.deliveryMethod || item.delivery_method || '').toLowerCase();
      return troupeName.includes(keyword) || delivery.includes(keyword);
    });
    renderRequests(filtered);
  }

  // 企画描画（四季風2列カード）
  function renderEvents(events) {
    const container = document.getElementById('events-container');
    document.getElementById('events-count').textContent = `（${events.length}件）`;

    if (events.length === 0) {
      container.innerHTML = '<div class="empty">該当する企画スケジュールはありません。</div>';
      return;
    }

    container.innerHTML = '';
    events.forEach(item => {
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = item.description || '';
      const plainText = tempDiv.textContent || tempDiv.innerText || '';
      const subtitleHtml = item.subtitle ? `<div class="card-subtitle">📍 ${escapeHtml(item.subtitle)}</div>` : '';

      const cardHtml = `
        <div class="shiki-card">
          <div class="card-top">
            <div class="card-thumb">Stage<br>Link</div>
            <div class="card-info">
              <div class="card-title">${escapeHtml(item.title || 'タイトルなし')}</div>
              ${subtitleHtml}
              <div class="card-desc">${escapeHtml(plainText)}</div>
            </div>
          </div>
          <div class="card-bottom">
            <div class="status-box">
              <div class="status-main">受付中！</div>
              <div class="status-sub">ID: #${item.id}</div>
            </div>
            <div class="action-btns">
              <button class="btn-shiki" onclick="alert('企画詳細画面へ連携可能')">公演スケジュール</button>
              <button class="btn-shiki" onclick="alert('詳細画面へ連携可能')">作品紹介</button>
            </div>
          </div>
        </div>
      `;
      container.insertAdjacentHTML('beforeend', cardHtml);
    });
  }

  // ビラ折込描画（四季風2列カード）
  function renderRequests(requests) {
    const container = document.getElementById('requests-container');
    document.getElementById('requests-count').textContent = `（${requests.length}件）`;

    if (requests.length === 0) {
      container.innerHTML = '<div class="empty">該当する折込予定はありません。</div>';
      return;
    }

    container.innerHTML = '';
    requests.forEach(item => {
      const foldingDate = item.foldingDate || item.folding_date || '日付未定';
      const troupeName = item.fromName || item.troupe_name || item.from_name || '名称未設定';
      const copies = item.copies ? `${item.copies}部` : '部数未設定';
      const size = item.size ? `(${item.size})` : '';
      const statusCode = item.status || '';
      const statusText = statusCode === 'accepted' ? '承認済み！' : (statusCode === 'pending' ? '申請中' : '受付中！');
      const delivery = item.deliveryMethod || item.delivery_method || '未定';

      const cardHtml = `
        <div class="shiki-card">
          <div class="card-top">
            <div class="card-thumb">ビラ<br>折込</div>
            <div class="card-info">
              <div class="card-title">${escapeHtml(troupeName)}</div>
              <div class="card-subtitle">受渡: ${escapeHtml(delivery)}</div>
              <div class="card-desc">予定部数: ${escapeHtml(copies)} ${escapeHtml(size)}</div>
            </div>
          </div>
          <div class="card-bottom">
            <div class="status-box">
              <div class="status-main">${escapeHtml(statusText)}</div>
              <div class="status-sub">${escapeHtml(foldingDate)} 折込分</div>
            </div>
            <div class="action-btns">
              <button class="btn-shiki" onclick="alert('折込申請詳細へ')">折込スケジュール</button>
              <button class="btn-shiki" onclick="alert('劇団詳細へ')">劇団紹介</button>
            </div>
          </div>
        </div>
      `;
      container.insertAdjacentHTML('beforeend', cardHtml);
    });
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>

</body>
</html>
