<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STAGELINK 2026 - Schedule</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #161f33;
      --accent-color: #00f2fe;
      --accent-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      --text-color: #ffffff;
      --text-sub: #94a3b8;
      --border-color: #2a364f;
      --stage-a: #ff007f;
      --stage-b: #00f2fe;
      --stage-c: #7928ca;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header h1 {
      font-size: 2.5rem;
      letter-spacing: 2px;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    /* フィルタータブ */
    .filter-group {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 10px 20px;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: bold;
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--accent-gradient);
      color: #000;
      border-color: transparent;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
    }

    /* タイムライン構造 */
    .schedule-list {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .schedule-list::before {
      content: '';
      position: absolute;
      left: 85px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--border-color);
    }

    @media (max-width: 600px) {
      .schedule-list::before {
        left: 20px;
      }
    }

    /* アイテムカード */
    .schedule-item {
      display: flex;
      align-items: flex-start;
      position: relative;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeIn 0.5s forwards ease-out;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .time-box {
      width: 70px;
      text-align: right;
      padding-right: 15px;
      font-weight: bold;
      color: var(--accent-color);
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    @media (max-width: 600px) {
      .time-box {
        display: none;
      }
    }

    .marker {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent-color);
      border: 3px solid var(--bg-color);
      position: absolute;
      left: 79px;
      top: 18px;
      z-index: 2;
      box-shadow: 0 0 10px var(--accent-color);
    }

    @media (max-width: 600px) {
      .marker {
        left: 14px;
      }
    }

    .card {
      margin-left: 30px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.2rem;
      flex-grow: 1;
      transition: transform 0.3s ease, border-color 0.3s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: translateX(5px);
      border-color: var(--accent-color);
    }

    @media (max-width: 600px) {
      .card {
        margin-left: 45px;
      }
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .mobile-time {
      display: none;
      font-size: 0.9rem;
      color: var(--accent-color);
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .mobile-time {
        display: block;
      }
    }

    .stage-badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .stage-main { background: rgba(255, 0, 127, 0.2); color: #ff007f; border: 1px solid #ff007f; }
    .stage-side { background: rgba(0, 242, 254, 0.2); color: #00f2fe; border: 1px solid #00f2fe; }
    .stage-lab  { background: rgba(121, 40, 202, 0.2); color: #b871ff; border: 1px solid #7928ca; }

    .card-title {
      font-size: 1.25rem;
      margin-bottom: 0.4rem;
    }

    .card-performer {
      color: var(--text-sub);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>STAGE LINK 2026</h1>
      <p style="color: var(--text-sub);">TIMETABLE & SCHEDULE</p>
    </div>

    <!-- ステージ切り替えフィルター -->
    <div class="filter-group">
      <button class="filter-btn active" onclick="filterSchedule('all')">ALL STAGES</button>
      <button class="filter-btn" onclick="filterSchedule('main')">MAIN STAGE</button>
      <button class="filter-btn" onclick="filterSchedule('side')">SIDE STAGE</button>
      <button class="filter-btn" onclick="filterSchedule('lab')">CREATIVE LAB</button>
    </div>

    <!-- スケジュールリスト -->
    <div class="schedule-list" id="scheduleContainer">
      <!-- JavaScriptで動的生成 -->
    </div>
  </div>

  <script>
    // スケジュールデータ
    const scheduleData = [
      { time: "11:00", stage: "main", stageName: "Main Stage", title: "Opening Keynote: The Future of Stage Technology", performer: "STAGELINK Project Team" },
      { time: "12:30", stage: "side", stageName: "Side Stage", title: "Interactive Lighting Showcase", performer: "Lumina Studio" },
      { time: "14:00", stage: "lab", stageName: "Creative Lab", title: "AI x Spatial Audio Live Session", performer: "SoundLab 2026" },
      { time: "15:30", stage: "main", stageName: "Main Stage", title: "Special Guest Performance", performer: "Cyber Synergy Beats" },
      { time: "17:00", stage: "side", stageName: "Side Stage", title: "Visual & Sensor Tech Panel", performer: "Guest Creators" },
      { time: "18:30", stage: "main", stageName: "Main Stage", title: "Grand Finale Live Stream", performer: "STAGELINK All Stars" }
    ];

    function renderSchedule(filter = 'all') {
      const container = document.getElementById('scheduleContainer');
      container.innerHTML = '';

      const filtered = filter === 'all' ? scheduleData : scheduleData.filter(item => item.stage === filter);

      filtered.forEach((item, index) => {
        const itemEl = document.createElement('div');
        itemEl.className = 'schedule-item';
        itemEl.style.animationDelay = `${index * 0.1}s`;

        itemEl.innerHTML = `
          <div class="time-box">${item.time}</div>
          <div class="marker"></div>
          <div class="card">
            <div class="card-header">
              <span class="mobile-time">${item.time}</span>
              <span class="stage-badge stage-${item.stage}">${item.stageName}</span>
            </div>
            <h2 class="card-title">${item.title}</h2>
            <p class="card-performer">${item.performer}</p>
          </div>
        `;
        container.appendChild(itemEl);
      });
    }

    function filterSchedule(stage) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderSchedule(stage);
    }

    // 初回レンダリング
    renderSchedule();
  </script>
</body>
</html>
