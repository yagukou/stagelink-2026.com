<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企画詳細｜Stage Link</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: #f4f5f7;
      color: #1f1a16;
      margin: 0;
      padding: 40px 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .back-btn {
      display: inline-block;
      margin-bottom: 20px;
      color: #7c2946;
      text-decoration: none;
      font-weight: bold;
    }
    .event-date {
      color: #718096;
      font-size: 14px;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 26px;
      color: #4a1428;
      margin-bottom: 20px;
    }
    .main-img {
      width: 100%;
      max-height: 400px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 24px;
    }
    
    /* 詳細文章の装飾スタイル */
    .description-body {
      font-size: 16px;
      line-height: 1.8;
      color: #2d3748;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .description-body h1, 
    .description-body h2, 
    .description-body h3 {
      color: #7c2946;
      margin-top: 24px;
      margin-bottom: 12px;
      border-left: 4px solid #7c2946;
      padding-left: 10px;
    }
    .description-body ul, 
    .description-body ol {
      margin: 16px 0;
      padding-left: 24px;
    }
    .description-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
    }
    .description-body table td, 
    .description-body table th {
      border: 1px solid #cbd5e0;
      padding: 8px 12px;
    }
  </style>
</head>
<body>

<div class="container">
  <a href="what.html" class="back-btn">← 企画一覧に戻る</a>
  <div class="event-date" id="date-display"></div>
  <h1 id="title-display">読み込み中...</h1>
  <img id="image-display" class="main-img" style="display: none;" alt="">
  
  <!-- 装飾HTMLがそのまま出力されるエリア -->
  <div class="description-body" id="desc-display"></div>
</div>

<script>
  const SUPABASE_URL = "https://blviywoprvcatwwrrysi.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJsdml5d29wcnZjYXR3d3JyeXNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MzM2MDUsImV4cCI6MjA5ODAwOTYwNX0.SAp7KNf21RKE5SStRlazyX5zKe-LVVCcEHz_fBV6UP8";

  // 1. ストレージアクセスブロック（Tracking Prevention）対策を含めたSupabase初期化
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: {
      persistSession: false,
      autoRefreshToken: false
    }
  });

  // 2. DOM読み込み完了時にデータを取得・反映する非同期関数
  document.addEventListener('DOMContentLoaded', async () => {
    const urlParams = new URLSearchParams(window.location.search);
    const eventId = urlParams.get('id');

    const titleEl = document.getElementById('title-display');
    const dateEl = document.getElementById('date-display');
    const imgEl = document.getElementById('image-display');
    const descEl = document.getElementById('desc-display');

    if (!eventId) {
      if (titleEl) titleEl.innerText = '企画が見つかりませんでした。';
      return;
    }

    try {
      const { data, error } = await supabaseClient
        .from('events')
        .select('*')
        .eq('id', eventId)
        .single();

      if (error || !data) {
        if (titleEl) titleEl.innerText = 'データの読み込みに失敗しました。';
        return;
      }

      if (titleEl) titleEl.innerText = data.title || 'タイトルなし';
      if (dateEl) dateEl.innerText = '開催日: ' + (data.event_date || '未定');
      
      if (imgEl && data.image_url) {
        imgEl.src = data.image_url;
        imgEl.style.display = 'block';
      }

      // ★ 修正ポイント：detail_content（詳細本文）を優先して流し込む（無ければ description）
      if (descEl) {
        descEl.innerHTML = data.detail_content || data.description || '詳細情報はありません。';
      }

    } catch (err) {
      console.error('取得エラー:', err);
      if (titleEl) titleEl.innerText = 'データの読み込み中にエラーが発生しました。';
    }
  });
</script>

</body>
</html>
