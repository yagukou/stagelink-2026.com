<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企画詳細｜Stage Link</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: #f4f5f7;
      color: #1f1a16;
      margin: 0;
      padding: 40px 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .back-btn {
      display: inline-block;
      margin-bottom: 20px;
      color: #7c2946;
      text-decoration: none;
      font-weight: bold;
    }
    .event-date {
      color: #718096;
      font-size: 14px;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 26px;
      color: #4a1428;
      margin-bottom: 20px;
    }
    .main-img {
      width: 100%;
      max-height: 400px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 24px;
    }
    
    /* 詳細文章の装飾スタイル */
    .description-body {
      font-size: 16px;
      line-height: 1.8;
      color: #2d3748;
    }
    .description-body h1, 
    .description-body h2, 
    .description-body h3 {
      color: #7c2946;
      margin-top: 24px;
      margin-bottom: 12px;
      border-left: 4px solid #7c2946;
      padding-left: 10px;
    }
    .description-body ul, 
    .description-body ol {
      margin: 16px 0;
      padding-left: 24px;
    }
    .description-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
    }
    .description-body table td, 
    .description-body table th {
      border: 1px solid #cbd5e0;
      padding: 8px 12px;
    }
/* 詳細本文やカード枠に追加 */
.description-body, .card {
  /* 長い英数字や記号でも自動で改行させる指定 */
  overflow-wrap: anywhere;
  word-break: break-word;
}
  </style>
</head>
<body>

<div class="container">
  <a href="what.html" class="back-btn">← 企画一覧に戻る</a>
  <div class="event-date" id="date-display"></div>
  <h1 id="title-display">読み込み中...</h1>
  <img id="image-display" class="main-img" style="display: none;" alt="">
  
  <!-- 装飾HTMLがそのまま出力されるエリア -->
  <div class="description-body" id="desc-display"></div>
</div>

<script>
  // ⚠️ ご自身の Supabase 情報に書き換えてください
  const SUPABASE_URL = "https://blviywoprvcatwwrrysi.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJsdml5d29wcnZjYXR3d3JyeXNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MzM2MDUsImV4cCI6MjA5ODAwOTYwNX0.SAp7KNf21RKE5SStRlazyX5zKe-LVVCcEHz_fBV6UP8";

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function loadDetail() {
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');

    if (!id) {
      document.getElementById('title-display').innerText = '企画が見つかりませんでした。';
      return;
    }

    const { data, error } = await supabaseClient
      .from('events')
      .select('*')
      .eq('id', id)
      .single();

    if (error || !data) {
      document.getElementById('title-display').innerText = 'データの読み込みに失敗しました。';
      return;
    }

    document.getElementById('title-display').innerText = data.title;
    document.getElementById('date-display').innerText = '開催日: ' + (data.event_date || '未定');
    
    // 装飾されたHTMLテキストを流し込み
    document.getElementById('desc-display').innerHTML = data.description || '詳細情報はありません。';

    if (data.image_url) {
      const img = document.getElementById('image-display');
      img.src = data.image_url;
      img.style.display = 'block';
    }
  }

  document.addEventListener('DOMContentLoaded', loadDetail);
</script>

</body>
</html>
